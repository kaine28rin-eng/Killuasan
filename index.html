<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>STUDYX · PDF Viewer</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Rock-solid CDN bypass (ignores your local js/ folder) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  
  <style>
    :root {
      --bg: #0b0c10;
      --accent-grad: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --card-border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      color: var(--text-main);
      overflow-x: hidden;
    }
    #flipbookView {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; z-index: 200; padding: 0; margin: 0;
      display: flex; flex-direction: column;
    }
    .flipbook-header {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; z-index: 10; background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
    }
    .flipbook-title { font-size: 16px; font-weight: 700; color: #fff; }
    .flipbook-close {
      background: rgba(255,255,255,0.1); border: 1px solid var(--card-border);
      color: #fff; width: 36px; height: 36px; border-radius: 10px;
      font-size: 18px; cursor: pointer; display: flex; align-items: center;
      justify-content: center;
    }
    .download-btn {
      background: var(--accent-grad); border: none; color: #fff;
      padding: 6px 14px; border-radius: 8px; font-size: 12px;
      font-weight: 700; cursor: pointer; margin-right: 8px;
      text-decoration: none;
    }
    .page-container {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 90vw; max-width: 500px; height: 95vh; max-height: 700px;
      perspective: 1200px; perspective-origin: center;
    }
    .page-canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      background: #fff;
    }
    .page-shadow {
      position: absolute; bottom: -5px; left: 0; width: 100%; height: 10px;
      background: rgba(0,0,0,0.3); border-radius: 50%; filter: blur(2px);
      opacity: 0.5;
    }
    .nav-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 44px; height: 44px; border-radius: 12px;
      background: rgba(255,255,255,0.1); border: 1px solid var(--card-border);
      color: #fff; display: flex; align-items: center;
      justify-content: center; font-size: 18px; cursor: pointer; z-index: 5;
    }
    .nav-prev { left: -60px; }
    .nav-next { right: -60px; }
    .page-indicator {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.7); font-size: 14px; padding: 8px 16px;
      background: rgba(0,0,0,0.3); border-radius: 20px;
    }
    .loading-overlay {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: rgba(255, 75, 43, 0.9); font-size: 16px; font-weight: 600; text-align: center;
    }
  </style>
</head>
<body>
  <div id="flipbookView">
    <div class="flipbook-header">
      <span class="flipbook-title" id="flipbookTitle">Loading...</span>
      <div>
        <a id="downloadBtn" class="download-btn" href="#" download>Download</a>
        <span class="flipbook-close" onclick="closeFlipbook()">✕</span>
      </div>
    </div>
    <div class="page-container" id="pageContainer">
      <div class="loading-overlay" id="loadingOverlay">Loading PDF...</div>
      <canvas class="page-canvas" id="pageCanvas"></canvas>
      <div class="page-shadow"></div>
      <div class="nav-btn nav-prev" onclick="prevPage()">‹</div>
      <div class="nav-btn nav-next" onclick="nextPage()">›</div>
      <div class="page-indicator" id="pageIndicator">Page — / —</div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    let pdfDoc = null;
    let currentPage = 1;
    let pageCount = 0;
    let pageRendering = false;
    let pageNumPending = null;
    const scale = 1.5;

    function openFlipbook(pdfPath, title) {
      document.getElementById('flipbookTitle').innerText = title;
      document.getElementById('pageIndicator').innerText = 'Loading...';
      document.getElementById('loadingOverlay').style.display = 'block';
      document.getElementById('pageCanvas').style.display = 'none';
      const dlBtn = document.getElementById('downloadBtn');
      dlBtn.href = pdfPath;
      dlBtn.download = title + '.pdf';
      loadPdf(pdfPath);
    }

    function closeFlipbook() {
      if (pdfDoc) { pdfDoc.destroy(); pdfDoc = null; }
      if (tg) { tg.close(); }
    }

    function showFlipbookError(msg) {
      document.getElementById('loadingOverlay').innerText = msg;
      document.getElementById('loadingOverlay').style.color = '#ff4b2b';
      document.getElementById('loadingOverlay').style.display = 'block';
      document.getElementById('pageCanvas').style.display = 'none';
      document.getElementById('pageIndicator').innerText = 'Error';
    }

    function loadPdf(pdfPath) {
      try {
        // Ensure PDF.js is loaded
        const pdfjs = window['pdfjs-dist/build/pdf'] || window.pdfjsLib;
        if (!pdfjs) throw new Error("PDF.js library failed to load.");
        
        pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        
        pdfjs.getDocument({ url: pdfPath }).promise.then(pdf => {
          pdfDoc = pdf;
          pageCount = pdf.numPages;
          currentPage = 1;
          document.getElementById('pageIndicator').innerText = `Page 1 / ${pageCount}`;
          renderPage();
        }).catch(err => {
          console.error('PDF load error:', err);
          showFlipbookError(`Error: PDF not found at ${pdfPath}\n\nMake sure the URL matches the exact file name.`);
        });
      } catch (e) {
        showFlipbookError(e.message);
      }
    }

    function renderPage() {
      if (!pdfDoc) return;
      if (pageRendering) {
        pageNumPending = currentPage;
        return;
      }
      
      pageRendering = true;
      const canvas = document.getElementById('pageCanvas');
      const ctx = canvas.getContext('2d');
      
      pdfDoc.getPage(currentPage).then(page => {
        const viewport = page.getViewport({ scale: scale });
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        
        const renderContext = { canvasContext: ctx, viewport: viewport };
        page.render(renderContext).promise.then(() => {
          pageRendering = false;
          document.getElementById('pageIndicator').innerText = `Page ${currentPage} / ${pageCount}`;
          document.getElementById('loadingOverlay').style.display = 'none';
          document.getElementById('pageCanvas').style.display = 'block';
          if (pageNumPending !== null) {
            currentPage = pageNumPending;
            pageNumPending = null;
            renderPage();
          }
        }).catch(err => {
          pageRendering = false;
          showFlipbookError(`Error rendering page ${currentPage}`);
        });
      }).catch(err => {
        pageRendering = false;
        showFlipbookError(`Error loading page ${currentPage}`);
      });
    }

    function nextPage() {
      if (currentPage < pageCount) { currentPage++; renderPage(); }
    }
