<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>STUDYX · PDF Viewer</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Standard CDN load (Preloads removed to prevent Brave browser blocking) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  
  <style>
    :root {
      --bg: #0b0c10;
      --accent-grad: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --card-border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      color: var(--text-main);
      overflow-x: hidden;
      overflow-y: auto;
    }
    #flipbookView {
      position: absolute; top: 0; left: 0; width: 100%; min-height: 100vh;
      background: #000; z-index: 200; padding: 0; margin: 0;
    }
    .flipbook-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; z-index: 100; background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
    }
    .flipbook-title { font-size: 16px; font-weight: 700; color: #fff; max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .flipbook-close {
      background: rgba(255,255,255,0.1); border: 1px solid var(--card-border);
      color: #fff; width: 36px; height: 36px; border-radius: 10px;
      font-size: 18px; cursor: pointer; display: flex; align-items: center;
      justify-content: center;
    }
    .download-btn {
      background: var(--accent-grad); border: none; color: #fff;
      padding: 6px 14px; border-radius: 8px; font-size: 12px;
      font-weight: 700; cursor: pointer; margin-right: 8px;
      text-decoration: none;
    }
    .page-container {
      margin-top: 80px;
      margin-bottom: 80px;
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .page-canvas {
      width: 96%;
      max-width: 800px;
      height: auto;
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .nav-btn {
      position: fixed;
      top: 50%; transform: translateY(-50%);
      width: 44px; height: 44px; border-radius: 12px;
      background: rgba(0,0,0,0.6); border: 1px solid var(--card-border);
      color: #fff; display: flex; align-items: center;
      justify-content: center; font-size: 24px; cursor: pointer; z-index: 50;
    }
    .nav-prev { left: 10px; }
    .nav-next { right: 10px; }
    .page-indicator {
      position: fixed;
      bottom: 20px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.9); font-size: 14px; padding: 8px 16px;
      background: rgba(0,0,0,0.7); border-radius: 20px; z-index: 50;
      backdrop-filter: blur(4px);
    }
    .loading-overlay {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: rgba(255, 75, 43, 0.9); font-size: 16px; font-weight: 600; text-align: center;
    }
  </style>
</head>
<body>
  <div id="flipbookView">
    <div class="flipbook-header">
      <span class="flipbook-title" id="flipbookTitle">Loading...</span>
      <div style="display: flex;">
        <a id="downloadBtn" class="download-btn" href="#" download>Download</a>
        <span class="flipbook-close" onclick="closeFlipbook()">✕</span>
      </div>
    </div>
    
    <div class="loading-overlay" id="loadingOverlay">Loading PDF...</div>
    
    <div class="page-container" id="pageContainer">
      <canvas class="page-canvas" id="pageCanvas"></canvas>
    </div>
    
    <div class="nav-btn nav-prev" onclick="prevPage()">‹</div>
    <div class="nav-btn nav-next" onclick="nextPage()">›</div>
    <div class="page-indicator" id="pageIndicator">Page — / —</div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    let pdfDoc = null;
    let currentPage = 1;
    let pageCount = 0;
    let pageRendering = false;
    let pageNumPending = null;
    
    const scale = 1.8; 

    function openFlipbook(pdfPath, title) {
      document.getElementById('flipbookTitle').innerText = title;
      document.getElementById('pageIndicator').innerText = 'Loading...';
      document.getElementById('loadingOverlay').style.display = 'block';
      document.getElementById('pageCanvas').style.display = 'none';
      const dlBtn = document.getElementById('downloadBtn');
      dlBtn.href = pdfPath;
      dlBtn.download = title + '.pdf';
      loadPdf(pdfPath);
    }

    function closeFlipbook() {
      if (pdfDoc) { pdfDoc.destroy(); pdfDoc = null; }
      if (tg) { tg.close(); }
    }

    function showFlipbookError(msg) {
      document.getElementById('loadingOverlay').innerText = msg;
      document.getElementById('loadingOverlay').style.color = '#ff4b2b';
      document.getElementById('loadingOverlay').style.display = 'block';
      document.getElementById('pageCanvas').style.display = 'none';
      document.getElementById('pageIndicator').innerText = 'Error';
    }

    function loadPdf(pdfPath) {
      try {
        const pdfjs = window['pdfjs-dist/build/pdf'] || window.pdfjsLib;
        if (!pdfjs) throw new Error("PDF.js library failed to load.");
        
        pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        
        // Optimized font loading map
        pdfjs.getDocument({ 
          url: pdfPath,
          cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/cmaps/',
          cMapPacked: true
        }).promise.then(pdf => {
          pdfDoc = pdf;
          pageCount = pdf.numPages;
          currentPage = 1;
          document.getElementById('pageIndicator').innerText = `Page 1 / ${pageCount}`;
          renderPage();
        }).catch(err => {
          console.error('PDF load error:', err);
          showFlipbookError(`Error: PDF not found at ${pdfPath}`);
        });
      } catch (e) {
        showFlipbookError(e.message);
      }
    }

    function renderPage() {
      if (!pdfDoc) return;
      if (pageRendering) {
        pageNumPending = currentPage;
        return;
      }
      
      pageRendering = true;
      const canvas = document.getElementById('pageCanvas');
      
      // Hardware acceleration by ignoring transparency
      const ctx = canvas.getContext('2d', { alpha: false }); 
      
      pdfDoc.getPage(currentPage).then(page => {
        const viewport = page.getViewport({ scale: scale });
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        const renderContext = { canvasContext: ctx, viewport: viewport };
        page.render(renderContext).promise.then(() => {
          pageRendering = false;
          document.getElementById('pageIndicator').innerText = `Page ${currentPage} / ${pageCount}`;
          document.getElementById('loadingOverlay').style.display = 'none';
          document.getElementById('pageCanvas').style.display = 'block';
          
          window.scrollTo(0, 0);
          
          if (pageNumPending !== null) {
            currentPage = pageNumPending;
            pageNumPending = null;
            renderPage();
          }
        });
      });
    }

    function nextPage() {
      if (currentPage < pageCount) {
        document.getElementById('loadingOverlay').style.display = 'block';
        currentPage++; 
        renderPage(); 
      }
    }

    function prevPage() {
      if (currentPage > 1) { 
        document.getElementById('loadingOverlay').style.display = 'block';
        currentPage--; 
        renderPage(); 
      }
    }

    let touchStartX = 0;
    document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, {passive: true});
    document.addEventListener('touchend', e => {
      let touchEndX = e.changedTouches[0].screenX;
      if (touchStartX - touchEndX > 100) nextPage();
      if (touchEndX - touchStartX > 100) prevPage();
    }, {passive: true});

    function handleBookParam() {
      const params = new URLSearchParams(window.location.search);
      const bookId = params.get('book');
      if (!bookId) return;
      openFlipbook('pdfs/' + bookId + '.pdf', bookId.replace(/-/g, ' '));
    }

    // Trigger instantly instead of waiting for window.onload
    handleBookParam();
  </script>
</body>
</html>
